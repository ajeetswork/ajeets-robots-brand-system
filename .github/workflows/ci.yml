name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911
        with:
          egress-policy: audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./.github/actions/brand-check
      - run: echo "CI checks complete"

  shared-brand-check:
    uses: ./.github/workflows/reusable-brand-check.yml
